# Daily movement (shipment) reports: volume of each commodity shipped from US shipping districts and imported
# through ports of entry, by truck, air and boat, in pounds ("1 lb units"). Every Market News office publishes one
# for its districts; summing all of them gives national weekly shipments, our measure of the quantity reaching
# the market (used to tell supply shocks from demand shifts). Slug IDs from the MARS report list (Market Type =
# Movement); some offices stopped reporting during the study period.
