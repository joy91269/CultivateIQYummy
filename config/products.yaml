# Products studied in this project.
# Each product has:
#   regex           - case-insensitive pattern used to decide whether a post/comment mentions the product
#   exclude_regex   - patterns that create false matches (removed before matching)
#   fts_query       - keyword used with the Arctic Shift comment full-text search (Postgres FTS, stemmed)
#   title_terms     - exact words for the Arctic Shift post-title search (not stemmed)
#   ams             - how the product appears in USDA AMS Terminal Market reports
# Reference market events used to validate the signals are listed in config/events_reference.csv

study_period:
  start: "2022-01-01"
  end: "2025-01-01"   # exclusive

# Google Trends search interest (data_collection/collect_google_trends.py): the same four search terms for every
# product, US only, weekly over the study period. {product} is the product id below.
google_trends:
  geo: US
  terms:
    total: "{product}"
    price: "{product} price"
    shortage: "{product} shortage"
    recall: "{product} recall"

products:
  avocado:
    display: Avocados
    regex: '\bavocados?\b|\bguac(amole)?\b|\bhass\b'
    exclude_regex: '\bhass(le|les|led)\b'
    fts_query: avocado OR guacamole
    title_terms: [avocado, avocados, guacamole]
    ams:
      report_group: fruit          # FV010 reports
      commodities: ["Avocados"]
  lettuce:
    display: Lettuce (iceberg / romaine)
    regex: '\blettuces?\b|\bromaine\b'
    exclude_regex: '\blettuce (in|on) (my|your|his|her) (head|teeth)\b'
    fts_query: lettuce OR romaine
    title_terms: [lettuce, romaine]
    ams:
      report_group: vegetables     # FV020 reports
      commodities: ["Lettuce, Iceberg", "Lettuce, Romaine"]
  onion:
    display: Onions
    regex: '\bonions?\b'
    exclude_regex: '\bthe onion\b|theonion\.com|\.onion\b|onion (router|link|site|address|routing)s?\b'
    fts_query: onion
    title_terms: [onion, onions]
    ams:
      report_group: onions_potatoes  # FV030 reports
      commodities: ["Onions, Dry"]
  cucumber:
    display: Cucumbers
    regex: '\bcucumbers?\b|\bcukes?\b'
    exclude_regex: '\bcool as a cucumber\b'
    fts_query: cucumber
    title_terms: [cucumber, cucumbers]
    ams:
      report_group: vegetables
      commodities: ["Cucumbers"]
